<!doctype html>
<!--
  PROTOTYPE — throwaway. Wayfinder ticket: "Type scale" (343-design-system/tickets/06-type-scale.md)
  Question: what are the named type steps (size / line-height / weight, mobile and desktop) and the minimum size?
  Three scales, switchable via ?variant=A|B|C (bottom bar or ← →). Width buttons switch mobile (< 768px, the
  client's `sm`) and desktop sizes:
    A — Compact: 14px body everywhere (today's de-facto text-sm), tight heading ladder
    B — Comfortable: 16px body everywhere, larger ladder, display scales up on desktop
    C — Two densities: 14px UI body + a 16px "prose" step for reading (questions, materials), and a big
        marketing display (needs Raleway 800 loaded)
  Colors are the decided palette tokens ("Color palette", variant A values). Font: Raleway from Google Fonts.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Type scale (#343)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --background:#FFFFFF; --foreground:#0B2747; --page:#F7FAFF; --muted:#EBF1F8; --muted-foreground:#555B64;
    --border:#DAE0E8; --input:#8B939D; --primary:#0B2747; --primary-foreground:#FFFFFF; --cta:#B35300; --cta-foreground:#FFFFFF;
    --accent:#E8F2FE; --success:#006352; --success-muted:#EDFFF9; --mint:#37D6B5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e9ec; font-family: ui-sans-serif, system-ui, sans-serif; color: #111; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 120px; }
  h1.chrome { font-size: 18px; margin: 0 0 4px; }
  .lede { font-size: 13px; color: #444; max-width: 920px; }
  .sec-title { font: 600 12px ui-sans-serif, system-ui; text-transform: uppercase; letter-spacing: .08em; color: #555; margin: 28px 0 8px; }

  /* the frame is the "device"; everything inside uses ONLY the named steps (.t-*) */
  .frame { margin: 0 auto; transition: max-width .2s; font-family: Raleway, sans-serif; color: var(--foreground); }
  .t-display, .t-h1, .t-h2, .t-h3, .t-h4, .t-body, .t-body-sm, .t-caption, .t-label, .t-button, .t-overline, .t-prose, .t-numeric { margin: 0; }
  .card { background: var(--background); border: 1px solid var(--border); border-radius: 8px; }
  .pad { padding: 20px; }
  .muted { color: var(--muted-foreground); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .frame.mobile .grid2 { grid-template-columns: 1fr; }
  .btn { border-radius: 6px; padding: 9px 16px; border: 1px solid transparent; display: inline-flex; align-items: center; }
  .btn-cta { background: var(--cta); color: var(--cta-foreground); }
  .btn-outline { background: #fff; color: var(--foreground); border-color: var(--border); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  table.dt { width: 100%; border-collapse: collapse; }
  table.dt th { text-align: left; padding: 0 12px; height: 36px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
  table.dt td { padding: 0 12px; height: 40px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }
  .input { width: 100%; padding: 8px 10px; border: 1px solid var(--input); border-radius: 6px; font-family: inherit; color: var(--foreground); }
  .alt { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; align-items: baseline; }
  .alt.sel { border-color: var(--primary); background: var(--accent); }
  .alt b { flex: none; width: 24px; height: 24px; border-radius: 99px; border: 1px solid var(--input); display: inline-grid; place-items: center; }
  .hero { background: var(--foreground); color: #fff; border-radius: 10px; padding: 40px 32px; }
  .frame.mobile .hero { padding: 28px 20px; }
  .hero .muted { color: #B2C2D7; }

  /* chrome */
  .spec { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
  .spec td, .spec th { border-bottom: 1px solid #eee; padding: 8px 10px; vertical-align: baseline; }
  .spec th { font: 600 11px ui-sans-serif; color: #555; text-align: left; }
  .spec .meta { font: 12px ui-monospace, monospace; color: #555; white-space: nowrap; }
  .warn { color: #b00; font-weight: 700; }
  .switch { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: #000; color: #fff; border-radius: 999px; padding: 8px 14px; font: 13px ui-sans-serif, system-ui; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 50; }
  .switch button { background: none; border: 0; color: #fff; font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .switch button.on { background: #fff; color: #000; }
  .switch #label { min-width: 230px; text-align: center; }
  pre.state { font: 11px ui-monospace, monospace; background: #fff; border: 1px dashed #aaa; border-radius: 8px; padding: 10px; white-space: pre-wrap; }
</style>
<style id="steps"></style>
</head>
<body>
<div class="wrap">
  <h1 class="chrome" id="vtitle"></h1>
  <div class="lede" id="vdesc"></div>

  <div class="sec-title">1 · Specimen (current width: <span id="modeName"></span>)</div>
  <div class="frame" id="f1"><table class="spec" id="spec"></table></div>

  <div class="sec-title">2 · Admin screen (dense)</div>
  <div class="frame" id="f2"></div>

  <div class="sec-title">3 · Student reading a question (long-form)</div>
  <div class="frame" id="f3"></div>

  <div class="sec-title">4 · Home hero (expressive)</div>
  <div class="frame" id="f4"></div>

  <div class="sec-title">State</div>
  <pre class="state" id="state"></pre>
</div>

<div class="switch">
  <button id="prev">◀</button><span id="label"></span><button id="next">▶</button>
  <span style="opacity:.4">|</span>
  <button data-w="desktop" class="w">desktop</button><button data-w="mobile" class="w">mobile 390</button>
</div>

<script>
// step: [mobile px, desktop px, line-height, weight, extra css]
const VARIANTS = {
  A: {
    name: 'Compact (14px body)',
    desc: ['One density everywhere: <b>body = 14px</b>, which is what the app already uses (<code>text-sm</code> is 888 of 1,744 size classes).',
      'Tight heading ladder (ratio ≈ 1.2). Headings barely grow on desktop. Minimum size <b>12px</b>.',
      'Weights: 400 / 500 / 600 / 700. 300 is dropped (1 use), and 800/900 are not loaded.'],
    steps: {
      display: [28,36,1.15,700], h1:[24,28,1.2,700], h2:[20,22,1.25,700], h3:[16,18,1.3,600], h4:[14,16,1.4,600],
      body:[14,14,1.5,400], 'body-sm':[13,13,1.45,400], caption:[12,12,1.4,500], label:[13,13,1.3,600], button:[14,14,1,600],
      overline:[12,12,1.3,600,'text-transform:uppercase;letter-spacing:.12em'], numeric:[24,28,1.1,700,'font-variant-numeric:tabular-nums'],
    },
  },
  B: {
    name: 'Comfortable (16px body)',
    desc: ['One density everywhere: <b>body = 16px</b> (the browser default and WCAG-friendly for reading), <b>body-sm = 14px</b> for tables and metadata.',
      'Larger ladder (ratio ≈ 1.25). Display and h1 scale up on desktop. Minimum size <b>12px</b>.',
      'Weights: 400 / 500 / 600 / 700.'],
    steps: {
      display: [36,48,1.1,700], h1:[28,36,1.15,700], h2:[22,28,1.2,700], h3:[18,22,1.3,600], h4:[16,18,1.35,600],
      body:[16,16,1.6,400], 'body-sm':[14,14,1.5,400], caption:[12,12,1.4,500], label:[14,14,1.3,600], button:[15,16,1,600],
      overline:[12,12,1.3,600,'text-transform:uppercase;letter-spacing:.14em'], numeric:[28,32,1.1,700,'font-variant-numeric:tabular-nums'],
    },
  },
  C: {
    name: 'Two densities (UI 14 · prose 16)',
    desc: ['<b>UI text = 14px</b> (tables, forms, cards, menus), plus a separate <b>prose = 16px / 1.7</b> step for long-form reading: question statements, study materials, news, rich text.',
      'Headings like A in the app. A <b>marketing display</b> that grows to 60px on desktop at weight <b>800</b> for the home only (requires loading Raleway 800).',
      'Minimum size <b>12px</b>.'],
    steps: {
      display: [36,60,1.05,800,'letter-spacing:-.01em'], h1:[24,30,1.2,700], h2:[20,24,1.25,700], h3:[16,18,1.3,600], h4:[14,16,1.4,600],
      body:[14,14,1.5,400], 'body-sm':[13,13,1.45,400], prose:[16,17,1.7,400], caption:[12,12,1.4,500], label:[13,13,1.3,600], button:[14,14,1,600],
      overline:[12,12,1.3,700,'text-transform:uppercase;letter-spacing:.16em'], numeric:[24,28,1.1,700,'font-variant-numeric:tabular-nums'],
    },
  },
};
const ORDER = ['display','h1','h2','h3','h4','prose','body','body-sm','caption','label','button','overline','numeric'];
const SAMPLE = {
  display:'Educação popular, digital e gratuita', h1:'Banco de provas', h2:'Questões da prova', h3:'Nova prova', h4:'Configurações do simulado',
  prose:'Leia o texto a seguir e responda à questão. A urbanização brasileira acelerou-se a partir da década de 1950.',
  body:'Os alunos podem refazer o simulado até a data de encerramento.', 'body-sm':'Atualizado há 3 dias por Ana Souza',
  caption:'68% da meta do semestre', label:'Nome da prova', button:'Salvar alterações', overline:'Para estudantes', numeric:'1.284',
};

let cur = new URLSearchParams(location.search).get('variant') || 'A'; if (!VARIANTS[cur]) cur = 'A';
let mode = new URLSearchParams(location.search).get('w') || 'desktop';
const pick = s => mode==='mobile' ? s[0] : s[1];

function css(v) {
  const st = { ...v.steps }; if (!st.prose) st.prose = st.body; // A/B: prose is just body
  return Object.entries(st).map(([k,s]) => `.t-${k}{font-size:${pick(s)}px;line-height:${s[2]};font-weight:${s[3]};${s[4]||''}}`).join('\n');
}

function render() {
  const v = VARIANTS[cur];
  document.getElementById('steps').textContent = css(v);
  document.getElementById('vtitle').textContent = `Variant ${cur} — ${v.name}`;
  document.getElementById('vdesc').innerHTML = '<ul>'+v.desc.map(d=>`<li>${d}</li>`).join('')+'</ul>';
  document.getElementById('label').textContent = `${cur} — ${v.name}`;
  document.getElementById('modeName').textContent = mode==='mobile' ? 'mobile (< 768px)' : 'desktop';
  document.querySelectorAll('.w').forEach(b=>b.classList.toggle('on', b.dataset.w===mode));
  document.querySelectorAll('.frame').forEach(f=>{ f.classList.toggle('mobile', mode==='mobile'); f.style.maxWidth = mode==='mobile' ? '390px' : '100%'; });

  // specimen
  const rows = ORDER.filter(k => v.steps[k] || k==='prose').map(k => {
    const s = v.steps[k] || v.steps.body; const alias = !v.steps[k];
    return `<tr><td class="meta">text-${k}${alias?'<br><span style="color:#999">= body</span>':''}</td>
      <td class="meta">${s[0]} → ${s[1]}px<br>lh ${s[2]} · ${s[3]}${s[4]?'<br>'+s[4].replace(/;/g,' '):''}</td>
      <td><p class="t-${k}">${SAMPLE[k]}</p></td></tr>`; }).join('');
  document.getElementById('spec').innerHTML = `<tr><th>step (Tailwind class)</th><th>mobile → desktop</th><th>sample</th></tr>${rows}`;

  // admin
  document.getElementById('f2').innerHTML = `<div class="grid2">
    <div class="card">
      <div class="pad" style="border-bottom:1px solid var(--border)">
        <div class="row" style="justify-content:space-between"><div><h1 class="t-h1">Banco de provas</h1><p class="t-body-sm muted">5 provas · ordenado por ano</p></div>
        <span class="btn btn-cta t-button">+ Nova prova</span></div>
      </div>
      <table class="dt"><thead><tr><th class="t-caption">Prova</th><th class="t-caption">Questões</th><th class="t-caption">Status</th></tr></thead><tbody>
        ${[['ENEM 2019 — 1ª aplicação','180/180','#006352','Concluída'],['ENEM 2019 — reaplicação','172/180','#C5131D','Faltando questões'],['FUVEST 2024','90/90','#856500','Em andamento']].map(r=>`<tr><td class="t-body">${r[0]}</td><td class="t-body muted">${r[1]}</td><td><span class="badge t-caption"><span class="dot" style="background:${r[2]}"></span>${r[3]}</span></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card pad">
        <h3 class="t-h3">Nova prova</h3>
        <label class="t-label" style="display:block;margin:12px 0 4px">Nome</label><input class="input t-body" value="ENEM 2025">
        <p class="t-caption muted" style="margin-top:4px">Aparece para os alunos na lista de simulados.</p>
        <div class="row" style="justify-content:flex-end;margin-top:16px"><span class="btn btn-outline t-button">Cancelar</span><span class="btn btn-primary t-button">Salvar</span></div>
      </div>
      <div class="card pad"><p class="t-caption muted">Simulados feitos</p><p class="t-numeric">1.284</p><p class="t-caption" style="color:var(--success)">▲ 12% no mês</p></div>
    </div>
  </div>`;

  // student
  document.getElementById('f3').innerHTML = `<div class="card pad" style="max-width:760px;margin:0 auto">
    <p class="t-overline muted">ENEM 2019 · Ciências Humanas · Questão 12</p>
    <h2 class="t-h2" style="margin:6px 0 14px">Urbanização brasileira</h2>
    <p class="t-prose">A urbanização brasileira acelerou-se a partir da década de 1950, impulsionada pela industrialização concentrada no Sudeste. Milhões de pessoas deixaram o campo em busca de trabalho nas cidades, que cresceram sem planejamento adequado de moradia, saneamento e transporte.</p>
    <p class="t-prose" style="margin-top:10px">Considerando esse processo, uma consequência direta da urbanização acelerada foi:</p>
    ${['a expansão das periferias e de habitações precárias nas grandes cidades.','a redução da população urbana nas regiões metropolitanas.','o fim da migração inter-regional no país.','a desconcentração industrial imediata para o Nordeste.'].map((a,i)=>`<div class="alt ${i===0?'sel':''}"><b class="t-label">${'ABCD'[i]}</b><span class="t-prose">${a}</span></div>`).join('')}
    <div class="row" style="justify-content:space-between;margin-top:16px"><span class="t-body-sm muted">12 de 45 · 38 min restantes</span><span class="btn btn-primary t-button">Próxima</span></div>
  </div>`;

  // hero
  document.getElementById('f4').innerHTML = `<div class="hero">
    <p class="t-overline" style="color:var(--mint)">Quem somos</p>
    <h1 class="t-display" style="margin:10px 0 14px;max-width:760px">Educação popular, digital e gratuita</h1>
    <p class="t-prose muted" style="max-width:560px">Mais de 300 cursinhos populares usam a plataforma para gerir turmas, simulados e inscrições.</p>
    <div class="row" style="margin-top:22px"><span class="btn btn-cta t-button">Quero participar</span><span class="btn t-button" style="border-color:#fff;color:#fff">Saiba mais</span></div>
  </div>`;

  const st = { ...v.steps }; const min = Math.min(...Object.values(st).map(s=>s[0]));
  document.getElementById('state').textContent = JSON.stringify({ variant: cur, name: v.name, mode, minimumPx: min, weightsNeeded: [...new Set(Object.values(st).map(s=>s[3]))].sort(), steps: Object.fromEntries(Object.entries(st).map(([k,s])=>[k,{mobile:s[0],desktop:s[1],lineHeight:s[2],weight:s[3],extra:s[4]||undefined}])) }, null, 2);
}

function setParam(k,val){ const u=new URL(location); u.searchParams.set(k,val); history.replaceState(null,'',u); }
function go(d){ const ks=Object.keys(VARIANTS); cur=ks[(ks.indexOf(cur)+d+ks.length)%ks.length]; setParam('variant',cur); render(); }
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.querySelectorAll('.w').forEach(b=>b.onclick=()=>{ mode=b.dataset.w; setParam('w',mode); render(); });
addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,[contenteditable]'))return; if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1); });
render();
</script>
</body>
</html>
